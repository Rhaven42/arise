# Construit l'application Android de test et la publie sur la page
# « Releases » du dépôt (téléchargeable directement depuis un téléphone).
name: test-apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Application de test (signée avec la clé de débogage)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk arise-test.apk
      - name: Publication sur la page Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete version-de-test --yes --cleanup-tag || true
          gh release create version-de-test arise-test.apk \
            --prerelease \
            --title "ARISE — version de test" \
            --notes "Version de test construite à partir de ${GITHUB_SHA::7}. Sur Android : téléchargez arise-test.apk, ouvrez-le et autorisez l'installation depuis cette source."
