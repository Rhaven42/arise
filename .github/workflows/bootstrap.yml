# Génère une seule fois le squelette Flutter (dossiers android/ios) et
# résout les dépendances avec l'outil officiel, puis committe le résultat.
name: bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Version de Flutter
        run: flutter --version | tee bootstrap_flutter_version.txt
      - name: Création du projet
        run: flutter create --org fr.arisia --project-name arise --platforms android,ios --empty .
      - name: Dépendances SDK
        run: flutter pub add flutter_localizations --sdk=flutter
      - name: Dépendances
        run: >
          flutter pub add flutter_riverpod riverpod_annotation go_router
          freezed_annotation json_annotation drift drift_flutter
          firebase_core firebase_auth cloud_firestore firebase_storage intl
      - name: Dépendances de développement
        run: >
          flutter pub add --dev build_runner freezed json_serializable
          riverpod_generator drift_dev very_good_analysis mocktail
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: squelette Flutter généré par flutter create"
          git push
