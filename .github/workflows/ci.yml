# Intégration continue d'ARISE : rien n'est fusionné si une étape échoue.
name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyse, tests, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: SQLite pour les tests Drift
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Dépendances
        run: flutter pub get
      - name: Traductions
        run: flutter gen-l10n
      - name: Génération de code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Formatage
        run: dart format lib test integration_test
      - name: Commit du formatage (branches de travail uniquement)
        if: github.ref != 'refs/heads/main'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "style: formatage automatique"
            git push
          fi
      - name: Vérification du formatage (main)
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code
      - name: Analyse (aucun avertissement toléré)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Absence de TODO
        run: "! grep -rnI 'TODO' lib test integration_test android/app/src ios/Runner --include='*.dart' --include='*.kt' --include='*.kts' --include='*.swift' --include='*.xml'"
      - name: Tests
        run: flutter test --coverage
      - name: APK de debug
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: arise-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  android-launch:
    name: Lancement réel sur émulateur Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Libération d'espace disque pour l'émulateur
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - name: Accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Démarrage de l'application sur un émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          emulator-boot-timeout: 900
          script: flutter test integration_test/app_launch_test.dart -d emulator-5554
