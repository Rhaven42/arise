# Intégration continue d'ARISE : rien n'est fusionné si une étape échoue.
name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyse, tests, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: SQLite pour les tests Drift
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Dépendances
        run: flutter pub get
      - name: Traductions
        run: flutter gen-l10n
      - name: Génération de code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyse (aucun avertissement toléré)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Absence de TODO
        run: "! grep -rnI 'TODO' lib test functions/src functions/test android/app/src ios/Runner --include='*.dart' --include='*.ts' --include='*.kt' --include='*.kts' --include='*.swift' --include='*.xml'"
      - name: Tests (dont parité de la configuration de jeu)
        run: flutter test --coverage
      - name: APK de debug
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: arise-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  functions:
    name: Cloud Functions (lint, build, tests, parité)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  rules:
    name: Règles de sécurité (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - name: Tests des règles Firestore
        run: >
          functions/node_modules/.bin/firebase emulators:exec
          --only firestore --project demo-arise
          "npm --prefix functions run test:rules"
