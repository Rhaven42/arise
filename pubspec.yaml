name: arise
description: "ARISE — application de sport gamifiée du royaume d'Arisia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  timezone: ^0.11.2
  wakelock_plus: ^1.8.2
  webview_flutter: ^4.14.1
dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/
    - assets/catalog/exercises.json
    - assets/animations/motions.json
    - assets/svg/body_front.svg
    - assets/svg/body_back.svg
    - assets/sounds/
    - assets/music/
    - assets/models/
    - assets/items/
    - assets/viewer/
    - assets/fonts/cinzel/OFL.txt
    - assets/fonts/im_fell_english/OFL.txt

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/cinzel/Cinzel-Variable.ttf
    - family: IMFellEnglish
      fonts:
        - asset: assets/fonts/im_fell_english/IMFellEnglish-Regular.ttf
        - asset: assets/fonts/im_fell_english/IMFellEnglish-Italic.ttf
          style: italic
