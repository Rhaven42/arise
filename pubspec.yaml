name: arise
description: "ARISE — application de sport gamifiée du royaume d'Arisia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
