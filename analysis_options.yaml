# Lint strict : aucun avertissement ni info toléré en CI
# (flutter analyze --fatal-infos --fatal-warnings).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - functions/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**
  errors:
    # Les retours manquants et les paramètres requis sont des erreurs.
    missing_return: error
    missing_required_param: error

linter:
  rules:
    # La documentation publique n'est pas exigée sur chaque membre : les
    # commentaires (en français) sont réservés à ce qui n'est pas évident.
    public_member_api_docs: false
    # Dart 3.13 permet d'écrire « const new(...) » au lieu de répéter le nom
    # de la classe. On garde la syntaxe classique, plus lisible et compatible
    # avec les générateurs de code (freezed, drift).
    unnecessary_type_name_in_constructor: false
